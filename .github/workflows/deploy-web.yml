name: deploy-web

on:
  workflow_run:
    workflows: ['generate-matches-and-email-html']
    types: [completed]
  workflow_dispatch: # also triggerable ad-hoc from the GitHub Actions UI

concurrency:
  group: deploy-web
  cancel-in-progress: false # never cancel an in-flight deploy

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Angular -- lint, test & deploy to Netlify
    runs-on: ubuntu-latest
    environment: prod # GitHub environment gate; secrets live here
    permissions:
      contents: write
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Install Chromium for CSP smoke test
        run: npx playwright install --with-deps chromium

      - name: Deploy
        run: make deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PLACEHOLDER_API_URL: ${{ secrets.PLACEHOLDER_API_URL }}

      - name: Commit netlify.toml if CSP hash was updated
        working-directory: ${{ github.workspace }}
        run: |
          git diff --quiet client/netlify.toml && exit 0
          git config user.name "JEFF-bot"
          git config user.email "actions@users.noreply.github.com"
          git add client/netlify.toml
          git commit -m "chore: update CSP script-src hashes [skip ci]"
          git push

  send-email:
    # Only the scheduled fetch triggers email; push-triggered fetches (Dependabot merges) don't
    needs: deploy
    if: ${{ github.event.workflow_run.event == 'schedule' }}
    name: Trigger daily email after morning deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch send_daily_email for the morning fetch only
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          hour=$(TZ=America/New_York date -d "${FETCH_STARTED_AT}" +%H)
          if (( 10#${hour} >= 15 )); then
            echo "Evening fetch (hour ${hour} ET), not sending email"
            exit 0
          fi
          gh workflow run send-daily-email.yml --repo "${{ github.repository }}" --ref main
