name: send_daily_email

on:
  # Send only after the fetch has committed fresh matches.json / index.html
  workflow_run:
    workflows: ['generate-matches-and-email-html']
    types: [completed]
  workflow_dispatch: # Allow manual triggering

jobs:
  send-email:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC
    steps:
      # The fetch also runs on a schedule in the evening; only the morning run sends email
      - name: Only send for the morning fetch
        id: window
        env:
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          if [[ -z "${RUN_STARTED_AT}" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=America/New_York date -d "${RUN_STARTED_AT}" +%H)
          if (( 10#${hour} < 15 )); then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Evening fetch (hour ${hour} ET), skipping email"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repo
        if: steps.window.outputs.proceed == 'true'
        uses: actions/checkout@v7

      - name: Check for fixtures
        id: check-fixtures
        if: steps.window.outputs.proceed == 'true'
        run: bash scripts/check-fixtures.sh

      - name: Configure AWS credentials
        if: steps.check-fixtures.outputs.has_fixtures == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: MLS-Today-SendEmail-GithubAction
          retry-max-attempts: 1

      - name: Send daily email to subscribers
        if: steps.check-fixtures.outputs.has_fixtures == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          UNSUBSCRIBE_URL: ${{ secrets.UNSUBSCRIBE_URL }}
        run: |
          set -euo pipefail

          # Query DynamoDB for active subscribers
          QUERY_RESULT=$(aws dynamodb query \
            --table-name EmailCollector \
            --index-name SiteIndex \
            --key-condition-expression "site = :site" \
            --filter-expression "active = :active" \
            --expression-attribute-values '{
              ":site": {"S": "mlstoday"},
              ":active": {"BOOL": true}
            }')

          echo "Subscribers fetched successfully"

          SEND_FAILED=0

          while read -r item; do
            email=$(echo "$item" | jq -r '.email.S')
            unsub_id=$(echo "$item" | jq -r '.unsubscribe.S')

            TO_EMAIL="$email" \
            UNSUBSCRIBE_URL="${UNSUBSCRIBE_URL}?id=${unsub_id}" \
            bash scripts/send-email.sh || SEND_FAILED=1
          done < <(echo "$QUERY_RESULT" | jq -c '.Items[]')

          if [[ "$SEND_FAILED" -eq 1 ]]; then
            echo "One or more emails failed to send"
            exit 1
          fi

          echo "All emails sent successfully"
